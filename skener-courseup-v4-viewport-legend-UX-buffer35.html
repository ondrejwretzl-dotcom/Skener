<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Skener okolí – course-up v4.3.2 (35% buffer, no-zoom-in fetch, smooth rotation)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="icon" type="image/png" href="vokoli2.png">

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>

  <style>
    :root{ --ui-bg: rgba(255,255,255,.9); --ui-shadow: 0 1px 4px rgba(0,0,0,.3); }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#f0f4f7; color:#333; overflow:hidden; }
    #map{ position:absolute; inset:0; }

    /* ===== MENU KATEGORIÍ ===== */
    #left-menu{ position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:8px; z-index:10; }
    .menu-icon{ width:38px; height:38px; background:var(--ui-bg); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:var(--ui-shadow); cursor:pointer; font-size:18px; }
    .menu-icon.active{ background:#4285F4; color:#fff; }

    /* ===== INFO / LOADING / LOG ===== */
    #info{ position:absolute; right:8px; bottom:11vh; background:var(--ui-bg); padding:6px 10px; border-radius:10px; box-shadow:var(--ui-shadow); z-index:10; font-size:11px; max-width:260px; text-align:right; }

    #loading{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:20; display:none; flex-direction:column; align-items:center; background:rgba(255,255,255,.85); padding:18px; border-radius:10px; box-shadow:var(--ui-shadow); }
    #loadingIcon{ width:40px; height:40px; }
    #loadingText{ margin-top:8px; color:#444; }

    #log{ position:absolute; left:0; bottom:0; width:100%; height:10vh; overflow-y:auto; background:var(--ui-bg); padding:5px; font-size:10px; box-shadow:0 -1px 0 #ccc inset; z-index:10; }
    #log .log-error{ color:#b42318; font-weight:700; }

    /* ===== POI PIN (SVG) ===== */
    .poi-pin{ width:26px; height:26px; display:block; filter:drop-shadow(0 1px 3px rgba(0,0,0,.45)); cursor:pointer; }

    /* ===== POI POPUP ===== */
    .poi-popup{ background:transparent; pointer-events:auto; cursor:pointer; }
    .poi-popup .bubble{ position:relative; padding:9px 16px; border-radius:16px; font-size:17px; line-height:1.25; color:var(--fg,#111); background:var(--bg,#fff); box-shadow:0 1px 4px rgba(0,0,0,.35); white-space:nowrap; display:flex; align-items:center; gap:10px; }
    .poi-popup .bubble .name{ font-weight:800; }
    .poi-popup .bubble .linklike{ text-decoration: underline; text-underline-offset: 3px; }
    .poi-popup .bubble::after{ content:""; position:absolute; left:50%; transform:translateX(-50%); top:100%; border-left:7px solid transparent; border-right:7px solid transparent; border-top:9px solid var(--bg,#fff); filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    .maplibregl-popup{ max-width:none; }
    .maplibregl-popup-tip{ display:none; }
    .maplibregl-popup-content{ background:transparent; box-shadow:none; padding:0; }

    /* RIDER – větší navigační šipka, nejvýš z-index */
    .rider{position:relative;width:44px;height:44px; z-index: 2147483647;}
    .rider .arrow{position:absolute;top:60%;left:30%;bottom:2px;width:36px;height:36px;transform-origin:50% 50%;transform:translate(-50%,0);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}

    /* CENTER BUTTON */
    #centerBtn{ position:absolute; right:8px; bottom:calc(11vh + 58px); z-index:12; width:50px; height:50px; border-radius:50%; background:#fff; box-shadow:var(--ui-shadow); display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid #e5e7eb; }
    #centerBtn svg{ width:26px; height:26px; fill:#111; }
    #centerBtn.active{ background:#0ea5e9; border-color:#0ea5e9; }
    #centerBtn.active svg{ fill:#fff; }

    /* ===== LEGENDA ===== */
    #color-legend{ position:absolute; left:8px; bottom:11vh; background:var(--ui-bg); padding:8px 12px; border-radius:10px; box-shadow:var(--ui-shadow); z-index:10; font-size:11px; }
    #color-legend .legend-item{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    #color-legend .legend-color{ width:16px; height:16px; border-radius:50%; border:1px solid #ccc; }

    /* ===== ACTION SHEET ===== */
    #actionSheet{ position:fixed; inset:0; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.35); z-index:50; }
    .sheet{ width:100%; background:#fff; border-top-left-radius:16px; border-top-right-radius:16px; box-shadow:0 -2px 10px rgba(0,0,0,.2); padding:16px; }
    .sheet-title{ font-size:18px; font-weight:800; text-align:center; margin-bottom:12px; }
    .btn-row{ display:flex; gap:12px; flex-wrap:wrap; }
    .big-btn{ flex:1 1 45%; background:#f3f4f6; border:none; border-radius:12px; padding:18px; font-size:18px; font-weight:800; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); }
    .big-btn:active{ transform:scale(.98); }
    .btn-primary{ background:#e8f0fe; color:#174ea6; }
    .btn-success{ background:#e8f5e9; color:#1b5e20; }
    .btn-danger{ background:#fff0f1; color:#b42318; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="loading">
    <svg id="loadingIcon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" stroke="#4285F4" stroke-width="10" fill="none" stroke-dasharray="180 80" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <p id="loadingText">Načítám data...</p>
  </div>

  <div id="left-menu">
    <div class="menu-icon active" id="toggleHistoric" title="Hrady a zámky">🏰</div>
    <div class="menu-icon" id="toggleTowers" title="Rozhledny">🗼</div>
    <div class="menu-icon" id="togglePeaks" title="Vrcholy">⛰️</div>
    <div class="menu-icon" id="toggleNature" title="Rezervace">🌿</div>
    <div class="menu-icon" id="toggleRestaurace" title="Jídlo">🍽️</div>
    <div class="menu-icon" id="toggleChurches" title="Kostely">⛪</div>
    <div class="menu-icon" id="toggleFuel" title="Benzínky">⛽️</div>
  </div>

  <!-- Center (follow) button -->
  <button id="centerBtn" title="Zacentrovat na moji polohu" aria-label="Zacentrovat">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 8a4 4 0 1 1 0 8a4 4 0 0 1 0-8zm0-6c.55 0 1 .45 1 1v2.06a9.01 9.01 0 0 1 7.94 7.94H23a1 1 0 1 1 0 2h-2.06A9.01 9.01 0 0 1 13 18.94V21a1 1 0 1 1-2 0v-2.06A9.01 9.01 0 0 1 3.06 13H1a1 1 0 1 1 0-2h2.06A9.01 9.01 0 0 1 11 5.06V3c0-.55.45-1 1-1z"/>
    </svg>
  </button>

  <div id="color-legend"></div>
  <div id="info">Načítám polohu…</div>
  <div id="log"></div>

  <!-- Action Sheet (dynamic) -->
  <div id="actionSheet">
    <div class="sheet">
      <div class="sheet-title" id="sheetTitle">Akce</div>
      <div class="btn-row" id="sheetBtns"></div>
    </div>
  </div>

<script>
// ===== STATE =====
let map=null, mapReady=false;
let lastPosition=null;
let heading=0; let isLoading=false; let poiRequestId=0; let inflight=0;
let riderMarker=null; 
let followUser=true; // default sleduj jezdce
let moveEndTimer=null; let lastZoom=null;
let lastFetchedBBox=null; // rozšířený bbox (o 35%) posledního fetche
let lastActiveCatsKey='';

// ===== ORIENTACE & ROTACE (ANTI-JITTER PIPELINE) =====
let courseUp = true;
const normBr = b => ((b % 360) + 360) % 360;
function shortestStep(from, to){ const f=normBr(from), t=normBr(to); let d=t-f; if(d>180) d-=360; if(d<-180) d+=360; return f+d; }
let animTargetBearing = null;
const MIN_BEARING_DELTA = 3;

function setArrowRotation(head, refBearing){
  const el = riderMarker?.getElement?.(); if(!el) return;
  const a = el.querySelector('.arrow'); if(!a) return;
  const rel = Number.isFinite(head) ? normBr(head - refBearing) : 0;
  a.style.transform = 'translate(-50%,0) rotate('+rel+'deg)';
}

function rotateToBearing(target){
  if(!map) return;
  const cur = normBr(map.getBearing());
  const tgt = shortestStep(cur, target);
  const delta = Math.abs(normBr(tgt - cur));
  animTargetBearing = tgt;
  setArrowRotation(heading, tgt);
  if(delta < MIN_BEARING_DELTA){ animTargetBearing = null; map.setBearing(tgt); return; }
  map.easeTo({ bearing: tgt, duration: 280, easing: t=>t, animate:true });
  map.once('moveend', ()=>{ animTargetBearing=null; setArrowRotation(heading, map.getBearing()); });
}

// POI per kategorie
const poiByCat = { toggleHistoric: [], toggleTowers: [], togglePeaks: [], toggleNature: [], toggleRestaurace: [], toggleChurches: [], toggleFuel: [] };

const logDiv=document.getElementById('log');
const infoDiv=document.getElementById('info');
const loadingEl=document.getElementById('loading');
const menuIcons=document.querySelectorAll('.menu-icon');
const centerBtn=document.getElementById('centerBtn');
const legendEl=document.getElementById('color-legend');

const actionSheet=document.getElementById('actionSheet');
const sheetTitle=document.getElementById('sheetTitle');
const sheetBtns=document.getElementById('sheetBtns');
let currentPoi=null; let currentUtter=null; let isPaused=false;

function log(m, level='info'){ const d=document.createElement('div'); d.textContent=`${new Date().toLocaleTimeString()} ${m}`; if(level==='error') d.classList.add('log-error'); logDiv.prepend(d) }
function setLoading(s){ isLoading=s; loadingEl.style.display=s?'flex':'none' }

// HELPERS
const deg2rad=d=>d*Math.PI/180;
function getDistance(a,b,c,d){ const R=6371, dLat=deg2rad(c-a), dLon=deg2rad(d-b); const x=Math.sin(dLat/2)**2 + Math.cos(deg2rad(a))*Math.cos(deg2rad(c))*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)) }
function getDirectionFromHeading(deg){ if(deg==null||deg===undefined) return 'N/A'; const dirs=['S','SV','V','JV','J','JZ','Z','SZ']; return dirs[Math.round(deg/45)%8] }
function getPoiColor(distance,max){ const r=Math.min(distance/max,1); if(r<1/3) return `rgb(255, ${Math.round(255*(r*3))}, 0)`; if(r<2/3) return `rgb(${Math.round(255*(1-(r-1/3)*3))},255,0)`; return `rgb(180, ${Math.round(255*(1-(r-2/3)*3))}, ${Math.round(255*((r-2/3)*3))})` }
function textColorForBg(rgb){ const m=rgb.match(/rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/i); let r=0,g=0,b=0; if(m){r=+m[1];g=+m[2];b=+m[3];} const L=(0.2126*r+0.7152*g+0.0722*b)/255; return L<0.55?'#fff':'#111' }
function updateLegend(maxR){ legendEl.innerHTML=''; const steps=5; for(let i=1;i<=steps;i++){ const d=(maxR/steps)*i, c=getPoiColor(d,maxR); const e=document.createElement('div'); e.className='legend-item'; e.innerHTML='<span class="legend-color" style="background:'+c+'"></span> '+d.toFixed(1)+' km'; legendEl.appendChild(e) } }

function viewportMaxDistanceFromUser(){ if(!lastPosition || !map) return 10; const b=map.getBounds(); const corners=[[b.getSouth(),b.getWest()],[b.getSouth(),b.getEast()],[b.getNorth(),b.getWest()],[b.getNorth(),b.getEast()]]; let maxD=0; for(const [la,lo] of corners){ maxD=Math.max(maxD, getDistance(lastPosition.lat,lastPosition.lon,la,lo)); } return Math.max(maxD,1); }

// BBOX utils (35% širší oblast)
function getViewportBBox(){ const b=map.getBounds(); return {s:b.getSouth(), w:b.getWest(), n:b.getNorth(), e:b.getEast()}; }
function expandBBox(b, pad=0.35){ const latSpan=b.n-b.s, lonSpan=b.e-b.w; return { s:b.s-latSpan*pad, w:b.w-lonSpan*pad, n:b.n+latSpan*pad, e:b.e+lonSpan*pad }; }
function containsBBox(outer, inner){ return inner.s>=outer.s && inner.w>=outer.w && inner.n<=outer.n && inner.e<=outer.e; }
function bboxToStr(b){ return `${b.s},${b.w},${b.n},${b.e}`; }

// MAP
function initMap(lat,lon){ if(mapReady) return; map=new maplibregl.Map({container:'map', style:'https://tiles.openfreemap.org/styles/liberty', center:[lon,lat], zoom:12, pitch:30, bearing:0, antialias:true});
  map.addControl(new maplibregl.NavigationControl(),'top-right');
  map.on('load',()=>{
    mapReady=true;
    try{ (map.getStyle().layers||[]).forEach(l=>{ if(l.type==='symbol'){
      try{ map.setLayoutProperty(l.id,'text-rotation-alignment','viewport'); }catch(e){}
      try{ map.setLayoutProperty(l.id,'icon-rotation-alignment','viewport'); }catch(e){}
      try{ map.setLayoutProperty(l.id,'text-pitch-alignment','viewport'); }catch(e){}
      try{ map.setLayoutProperty(l.id,'icon-pitch-alignment','viewport'); }catch(e){}
    }});}catch(e){}
    map.on('move', ()=>{ placeRiderToViewportCenter(); });
    map.on('moveend', ()=>{ if(moveEndTimer) clearTimeout(moveEndTimer); moveEndTimer=setTimeout(()=> scheduleViewportFetch(false,'moveend'), 250); });
    if(lastPosition){ updateRider(lastPosition.lat,lastPosition.lon,heading); scheduleViewportFetch(true,'first-load'); }
  });
}

// Rider
function ensureRider(){ if(riderMarker) return riderMarker; const el=document.createElement('div'); el.className='rider'; el.innerHTML=`<svg class="arrow" viewBox="0 0 24 24"><path fill="#1976d2" d="M12 2l6.5 18.5L12 16l-6.5 4.5L12 2z"/></svg>`; riderMarker=new maplibregl.Marker({element:el, anchor:'bottom'}); return riderMarker; }
function placeRiderToViewportCenter(){ if(!map) return; ensureRider(); riderMarker.setLngLat(map.getCenter()); if(!riderMarker._map) riderMarker.addTo(map); }
function updateRider(lat,lon,head){ if(!Number.isFinite(lat)||!Number.isFinite(lon)||!map) return; placeRiderToViewportCenter(); const refBr = (animTargetBearing!=null)? animTargetBearing : map.getBearing(); setArrowRotation(head, refBr); if(followUser){ map.easeTo({center:[lon,lat], duration:300}); centerBtn.classList.add('active'); placeRiderToViewportCenter(); } }
centerBtn.addEventListener('click', ()=>{ followUser=true; centerBtn.classList.add('active'); if(lastPosition && map){ map.easeTo({center:[lastPosition.lon,lastPosition.lat], duration:350}); placeRiderToViewportCenter(); } });

// POI RENDER (bližší POI výš)
function clearCategory(cat){ (poiByCat[cat]||[]).forEach(o=>{ try{o.marker.remove()}catch(e){} try{o.popup.remove()}catch(e){} }); poiByCat[cat]=[] }
function renderPOIsCategory(pois, cat){ clearCategory(cat); const maxR = viewportMaxDistanceFromUser(); updateLegend(maxR); pois.sort((a,b)=> (b.distanceKm||0) - (a.distanceKm||0)); pois.forEach(p=>{ if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon)) return; const refLat = (lastPosition? lastPosition.lat : map.getCenter().lat); const refLon = (lastPosition? lastPosition.lon : map.getCenter().lng); const dist = getDistance(refLat,refLon,p.lat,p.lon); p.distanceKm = dist; const bg=getPoiColor(dist, maxR); const fg=textColorForBg(bg); const label=(cat==='togglePeaks' && p.ele)? `${p.name} (${p.ele} m)` : p.name; const el=document.createElement('div'); el.innerHTML='<svg class="poi-pin" viewBox="0 0 24 24" aria-hidden="true"><path fill="'+bg+'" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path><circle cx="12" cy="9" r="2.6" fill="rgba(255,255,255,0.92)"></circle></svg>';
  const marker=new maplibregl.Marker({element:el, anchor:'bottom'}).setLngLat([p.lon,p.lat]).addTo(map);
  const wrap=document.createElement('div'); wrap.className='poi-popup'; const b=document.createElement('div'); b.className='bubble'; const hasLink = !!(p.wiki || p.website); const nameSpan = document.createElement('span'); nameSpan.className = 'name' + (hasLink?' linklike':''); nameSpan.textContent = label; b.appendChild(nameSpan); b.style.setProperty('--bg',bg); b.style.setProperty('--fg',fg); wrap.appendChild(b); const popup=new maplibregl.Popup({ closeButton:false, closeOnClick:false, anchor:'bottom', offset:28 }).setDOMContent(wrap).setLngLat([p.lon,p.lat]).addTo(map); try{ const z = 100000 - Math.round(dist*100); popup._container.style.zIndex = String(z); }catch(e){} const clickHandler = (ev)=>{ ev.stopPropagation(); handlePoiAction(p); }; wrap.addEventListener('click', clickHandler); b.addEventListener('click', clickHandler); el.addEventListener('click', clickHandler); poiByCat[cat].push({marker,popup}); }); }

// ===== ACTION SHEET (wik i/web logika) =====
function showSheet(title, buttons){ sheetTitle.textContent=title||'Akce'; sheetBtns.innerHTML=''; buttons.forEach(btn=>{ const b=document.createElement('button'); b.className = 'big-btn '+(btn.cl||''); b.textContent=btn.label; b.onclick=btn.onClick; sheetBtns.appendChild(b); }); actionSheet.style.display='flex'; }
function hideSheet(){ actionSheet.style.display='none'; }
function stopTTS(){ try{ speechSynthesis.cancel(); currentUtter=null; isPaused=false; }catch(e){} }
function pauseTTS(){ try{ speechSynthesis.pause(); isPaused=true; }catch(e){} }
function resumeTTS(){ try{ speechSynthesis.resume(); isPaused=false; }catch(e){} }
function fetchWikiText(wikiTag){ const page= wikiTag.includes(':')? wikiTag.split(':').slice(1).join(':') : wikiTag; const title=encodeURIComponent(page.replace(/\s/g,'_')); const url='https://cs.wikipedia.org/api/rest_v1/page/summary/'+title; return fetch(url).then(r=>r.json()).then(d=> d.extract||d.description||''); }
function playWiki(wikiTag){ if(currentUtter && isPaused){ resumeTTS(); return; } if(currentUtter){ stopTTS(); } setLoading(true); fetchWikiText(wikiTag).then(txt=>{ setLoading(false); if(!txt) return; const u=new SpeechSynthesisUtterance(txt); u.lang='cs-CZ'; u.onend=()=>{ currentUtter=null; isPaused=false; }; u.onerror=()=>{ currentUtter=null; isPaused=false; }; currentUtter=u; speechSynthesis.speak(u); }).catch(()=>setLoading(false)); }
function handlePoiAction(p){ currentPoi=p; const hasWiki=!!p.wiki; const hasWeb=!!p.website; if(hasWiki && !hasWeb){ showSheet(p.name, [ {label:'▶︎ Přehrát', cl:'btn-primary', onClick:()=>playWiki(p.wiki)}, {label:'⏸︎ Pauza',  cl:'',           onClick:()=>pauseTTS()}, {label:'Zavřít',   cl:'btn-danger', onClick:()=>{ hideSheet(); stopTTS(); }} ]); } else if(!hasWiki && hasWeb){ showSheet(p.name, [ {label:'🌐 Otevřít', cl:'btn-success', onClick:()=>{ try{ window.open(p.website,'_blank','noopener'); }catch(e){} }}, {label:'Zavřít',     cl:'btn-danger',  onClick:()=>{ hideSheet(); }} ]); } else if(hasWiki && hasWeb){ showSheet(p.name, [ {label:'📘 Wiki – přehrát', cl:'btn-primary', onClick:()=>playWiki(p.wiki)}, {label:'🌐 Web – otevřít', cl:'btn-success', onClick:()=>{ try{ window.open(p.website,'_blank','noopener'); }catch(e){} }}, {label:'⏸︎ Pauza', cl:'', onClick:()=>pauseTTS()}, {label:'Zavřít', cl:'btn-danger', onClick:()=>{ hideSheet(); stopTTS(); }} ]); } }

// ===== Overpass: Sjednocený dotaz + stručný log =====
async function fetchWithRetry(url,opt,id,retries=2,delay=900){ let attempt = 0; const maxA = retries+1; const t0 = performance.now(); while(true){ attempt++; try{ if(id!==poiRequestId) throw new Error('CANCELLED'); const r = await fetch(url,opt); if(!r.ok) throw new Error('HTTP '+r.status); if(id!==poiRequestId) throw new Error('CANCELLED'); const data = await r.json(); log(`OK req=${id} in ${(performance.now()-t0).toFixed(0)}ms elems=${(data.elements||[]).length}`); return data; }catch(e){ if(e.message==='CANCELLED'){ log(`CANCEL req=${id}`); throw e; } if(attempt>=maxA){ log(`ERROR req=${id} ${e.message}`,'error'); throw e; } log(`RETRY req=${id} in ${delay}ms (${attempt}/${maxA})`,'error'); await new Promise(res=>setTimeout(res,delay)); } } }

const queryParts = {
  toggleHistoric: `nwr[historic~"^(castle|ruins|chateau|fortress)$"]({{bbox}})(if:t["name"]);`,
  toggleTowers: `nwr["man_made"="tower"]["tower:type"="observation"]({{bbox}})(if:t["name"]);`,
  togglePeaks: `nwr["natural"="peak"]({{bbox}})(if:t["ele"] > 400)(if:t["name"]);`,
  toggleNature: `nwr["leisure"="nature_reserve"]({{bbox}})(if:t["name"]);`,
  toggleRestaurace: `nwr["amenity"~"cafe|pub|bar|restaurant|food|biergarten"]({{bbox}})(if:t["name"]);`,
  toggleChurches: `nwr[building~"church|cathedral|basilica"]({{bbox}})(if:t["name"]);`,
  toggleFuel: `nwr["amenity"="fuel"]({{bbox}})(if:t["name"]);`
};

menuIcons.forEach(ic=> ic.addEventListener('click', ()=>{ ic.classList.toggle('active'); if(!ic.classList.contains('active')){ clearCategory(ic.id); } scheduleViewportFetch(true,'category-toggle'); }));

function activeCats(){ return Array.from(menuIcons).filter(i=>i.classList.contains('active')).map(i=>i.id); }
function activeCatsKey(){ return activeCats().sort().join('|'); }

// ===== NOVÁ LOGIKA FETCH =====
// - ŽÁDNÝ fetch při zoom-in (pokud nezajedeš mimo buffer)
// - Fetch při zoom-out pouze pokud nový viewport přesáhne poslední načtený 35% buffer
// - Fetch při změně kategorií nebo při panu mimo buffer
function scheduleViewportFetch(force=false, reason='manual'){
  if(!mapReady) return;
  const inner = getViewportBBox();
  const zoom = map.getZoom();
  const catsKey = activeCatsKey();
  const catsChanged = (catsKey !== lastActiveCatsKey);
  const outsideLoaded = !lastFetchedBBox || !containsBBox(lastFetchedBBox, inner);
  const zoomOut = (lastZoom!=null && zoom < lastZoom - 1e-6); // MapLibre: menší číslo = zoom out

  // rozhodnutí: fetch jen když force, kategorie, nebo jsme MIMO buffer (pan/zoom-out)
  const should = force || catsChanged || (outsideLoaded && (zoomOut || lastZoom==null || !containsBBox(lastFetchedBBox, inner)));

  if(should){
    const expanded = expandBBox(inner, 0.35); // <<< 35 % buffer
    log(`FETCH req=${poiRequestId+1} cats=[${catsKey}] z=${zoom.toFixed(2)} reason=${force?'force':catsChanged?'cats':outsideLoaded?(zoomOut?'zoomout':'pan'):'-'}`);
    getPOIsViewport(expanded);
    lastFetchedBBox = expanded; lastZoom = zoom; lastActiveCatsKey = catsKey;
  }else{
    lastZoom = zoom; lastActiveCatsKey = catsKey; // aktualizuj snapshot bez fetch
  }
}

function classifyCategory(tags){ const t=tags||{}; if(t.historic && /^(castle|ruins|chateau|fortress)$/i.test(t.historic)) return 'toggleHistoric'; if(t['man_made']==='tower' && t['tower:type']==='observation') return 'toggleTowers'; if(t.natural==='peak' && (!t.ele || +t.ele>400)) return 'togglePeaks'; if(t.leisure==='nature_reserve') return 'toggleNature'; if(t.building && /(church|cathedral|basilica)/i.test(t.building)) return 'toggleChurches'; if(t.amenity==='fuel') return 'toggleFuel'; if(t.amenity && /(cafe|pub|bar|restaurant|food|biergarten)/i.test(t.amenity)) return 'toggleRestaurace'; return null; }

function getPOIsViewport(expandedBBox){ if(!mapReady) return; poiRequestId++; const id=poiRequestId; inflight=0; setLoading(true); const cats = activeCats(); if(!cats.length){ Object.keys(poiByCat).forEach(clearCategory); setLoading(false); log('NO CATS'); return; } const bboxStr = bboxToStr(expandedBBox); const body = cats.map(cid => queryParts[cid].replace(/\{\{bbox\}\}/g, bboxStr)).join(''); const query = `[out:json][timeout:20];(${body});out center;`; fetchWithRetry('https://overpass-api.de/api/interpreter', {method:'POST', body:query}, id).then(data=>{ if(id!==poiRequestId) return; const ref = lastPosition || {lat: map.getCenter().lat, lon: map.getCenter().lng}; const grouped={}; cats.forEach(c=>grouped[c]=[]); (data.elements||[]).forEach(e=>{ const la=e.lat ?? e.center?.lat; const lo=e.lon ?? e.center?.lon; if(!Number.isFinite(la)||!Number.isFinite(lo)) return; const cat = classifyCategory(e.tags)||'__other'; if(!grouped[cat]) grouped[cat]=[]; const website = e.tags?.website || e.tags?.url || e.tags?.['contact:website'] || null; grouped[cat].push({ name:e.tags?.name || 'Neznámý', ele:e.tags?.ele || null, lat:la, lon:lo, distanceKm:getDistance(ref.lat,ref.lon,la,lo), wiki:e.tags?.wikipedia || '', website }); }); cats.forEach(c=> renderPOIsCategory(grouped[c]||[], c)); log(`RENDER cats=[${cats.join('|')}]`); }).catch(err=>{ if(err.message!=='CANCELLED') log('ERR '+err,'error'); }).finally(()=>{ inflight=0; setLoading(false); }); }

// GEO – watchPosition
let watchId=null;
function startWatch(){ try{ if(watchId!=null) navigator.geolocation.clearWatch(watchId); watchId = navigator.geolocation.watchPosition(pos=>{ const crd=pos.coords; const latitude=crd.latitude, longitude=crd.longitude, h=crd.heading, altitude=crd.altitude; if(!Number.isFinite(latitude)||!Number.isFinite(longitude)) return; lastPosition={lat:latitude, lon:longitude}; if(!mapReady) initMap(latitude, longitude); if(mapReady){ heading = Number.isFinite(h)?h:heading; updateRider(latitude, longitude, heading); if(courseUp && Number.isFinite(h)) rotateToBearing(normBr(h)); } infoDiv.textContent = `Poloha: ${latitude.toFixed(5)}, ${longitude.toFixed(5)} | Směr: ${getDirectionFromHeading(heading)} | Nadm. v: ${altitude!=null?Math.round(altitude)+' m':'N/A'}`; }, err=>{ infoDiv.textContent='GPS nedostupná – fallback'; if(!lastPosition){ lastPosition={lat:50.2333, lon:14.3833}; if(!mapReady) initMap(lastPosition.lat, lastPosition.lon); if(mapReady){ updateRider(lastPosition.lat,lastPosition.lon, heading); } } }, { enableHighAccuracy:true, timeout:8000, maximumAge:3000 }); }catch(e){}
}

startWatch();
</script>
