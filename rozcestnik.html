<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>V okolí – rozcestník</title>
  <meta name="theme-color" content="#0ea5e9">
  <link rel="icon" href="vokoli2.png" type="image/png">
  <style>
    :root{
      --bg: linear-gradient(180deg,#f8fafc 0%, #eef2f7 60%, #e6eef6 100%);
      --card-bg: #ffffff;
      --fg: #0f172a;        /* slate-900 */
      --fg-muted: #475569;  /* slate-600 */
      --brand: #0ea5e9;     /* sky-500 */
      --brand-2: #22c55e;   /* green-500 */
      --shadow: 0 8px 20px rgba(2, 6, 23, .08);
      --radius: 16px;
      --tap: 14px;          /* spacing */
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      padding: max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),12px) max(env(safe-area-inset-bottom),12px) max(env(safe-area-inset-left),12px);
      display:flex; flex-direction:column; gap:18px;
    }

    /* ===== HEADER ===== */
    .hero{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
    .logo-wrap{ width:96px; height:96px; border-radius:50%; background:#fff; box-shadow:var(--shadow); display:grid; place-items:center; overflow:hidden; }
    .logo-wrap img{ width:80px; height:80px; object-fit:contain; }
    h1{ margin:0; font-size:26px; font-weight:900; letter-spacing:.2px; }
    .subtitle{ font-size:13px; color:var(--fg-muted); }

    /* ===== GRID OF TILES ===== */
    .grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; margin-top:4px; }
    @media (max-width:380px){ .grid{ grid-template-columns: 1fr; } }

    a.tile{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
      min-height:72px; padding:10px; border-radius: var(--radius); background:var(--card-bg); color:inherit; text-decoration:none;
      box-shadow: var(--shadow); border:1px solid rgba(2,6,23,.06);
      transition: transform .06s ease, box-shadow .12s ease;
    }
    a.tile:active{ transform: scale(.98); }
    a.tile:focus-visible{ outline: 3px solid color-mix(in oklab, var(--brand) 60%, white); outline-offset: 3px; }

    .ico{ font-size:34px; line-height:1; filter: drop-shadow(0 1px 0 rgba(0,0,0,.06)); }
    .label{ font-weight:800; font-size:16px; letter-spacing:.2px; text-align:center; }
    .hint{ font-size:12px; color:var(--fg-muted); }

    /* Small badge ribbon */
    .badge{ position:absolute; top:10px; right:10px; font-size:11px; background: #eef6ff; color:#0b66c3; border-radius:999px; padding:5px 8px; font-weight:700; }

    /* Make the primary tile more prominent (optional) */
    .emph{ background: linear-gradient(180deg, #f0fbff 0%, #ffffff 55%); border-color: rgba(14,165,233,.25); }

    footer{ margin-top:auto; text-align:center; font-size:11px; color:var(--fg-muted); }
  </style>
</head>
<body>
  <header class="hero" aria-label="Hlavní nabídka">
    <div class="logo-wrap"><img src="vokoli2.png" alt="V okolí – logo"></div>
    <h1>V okolí</h1>
    <div class="subtitle">Rozcestník map a režimů – velké, snadno klikatelné dlaždice</div>
  </header>

  <main class="grid" role="navigation" aria-label="Stránky">
    <a class="tile emph" href="./skener-courseup-v4-viewport-legend-UX-buffer35.html" aria-label="Moto mapa realtime">
      <div class="badge">LIVE</div>
      <div class="ico">🧭</div>
      <div class="label">Moto mapa realtime</div>
      <div class="hint">viewport + follow</div>
    </a>

    <a class="tile" href="./skener-courseup-v3-navctrl-rotfix-topradius-refresh-logging.html" aria-label="Moto mapa v3">
      <div class="ico">🗺️</div>
      <div class="label">Moto mapa v3</div>
      <div class="hint">course‑up + bubliny</div>
    </a>

    <a class="tile" href="./skener-courseup-v3-pesi.html" aria-label="Pěší mapa">
      <div class="ico">🚶</div>
      <div class="label">Pěší mapa</div>
      <div class="hint">turistika / pěšky</div>
    </a>

    <a class="tile" href="./skener24.html" aria-label="Radar">
      <div class="ico">📡</div>
      <div class="label">Radar</div>
      <div class="hint">rychlý přehled</div>
    </a>
  </main>

  <footer>© 2026 V okolí • Optimalizováno pro mobil • Velké tap oblasti</footer>
</body>
</html>
