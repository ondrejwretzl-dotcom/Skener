<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Viewer (no-exe varianta)</title>
    <style>
      body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background:#f6f8fa; }
      header { padding: 12px 16px; background:#fff; border-bottom:1px solid #d0d7de; display:flex; gap:10px; align-items:center; }
      main { max-width: 960px; margin: 20px auto; padding: 20px; background:#fff; border:1px solid #d0d7de; border-radius:10px; }
      pre { background:#f6f8fa; border:1px solid #d0d7de; border-radius:6px; padding:12px; overflow:auto; }
      code { font-family: Consolas, monospace; }
      .hint { color:#57606a; }
    </style>
  </head>
  <body>
    <header>
      <input id="fileInput" type="file" accept=".md,.markdown,.mdown,text/markdown" />
      <span class="hint">Alternativa bez .exe: otevři tento HTML soubor v prohlížeči a načti .md</span>
    </header>
    <main id="out"><p class="hint">Vyber markdown soubor.</p></main>
    <script>
      const input = document.getElementById('fileInput');
      const out = document.getElementById('out');

      function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
      function render(md){
        let html = esc(md)
          .replace(/^### (.*)$/gm, '<h3>$1</h3>')
          .replace(/^## (.*)$/gm, '<h2>$1</h2>')
          .replace(/^# (.*)$/gm, '<h1>$1</h1>')
          .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\n\n+/g, '</p><p>')
          .replace(/\n/g, '<br/>');
        if (!html.startsWith('<h') && !html.startsWith('<p')) html = `<p>${html}</p>`;
        return html;
      }

      input.addEventListener('change', async () => {
        const file = input.files?.[0];
        if (!file) return;
        const text = await file.text();
        out.innerHTML = render(text);
      });
    </script>
  </body>
</html>
