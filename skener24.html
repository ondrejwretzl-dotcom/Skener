<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="windows-1250">
  <title>Skener okolí - Vylepšeno</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  
  <style>
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      background-color: #f0f4f7;
      color: #333;
      overflow: hidden; /* Zabrání nechtěnému scrollování */
    }
    
    #main-container {
      width: 100vw;
      height: 90vh;
      position: relative;
    }

    #radar-overlay {
      width: 100%;
      height: 100%;
      background: transparent;
      position: relative;
      border: 2px dashed #999;
      box-sizing: border-box;
      z-index: 2;
    }
    
    .poi-container {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 15;
      transition: top 0.5s ease-out, left 0.5s ease-out; /* Plynulý přechod při změně pozice */
    }
    
    .poi-dot {
      width: 12px;
      height: 12px;
      background: black;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      transition: background-color 0.3s, transform 0.2s;
    }
    
    .poi-container.active .poi-dot {
      background-color: #28a745; /* Zelená pro aktivní bod */
      transform: scale(1.5);
    }

    .poi-bubble {
      position: absolute;
      background: #fff;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      opacity: 0;
      animation: fadeIn 0.5s forwards;
      transition: background-color 0.3s;
    }
    
    .poi-container.active .poi-bubble {
        background-color: #d4edda;
        font-weight: bold;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    #controls {
      position: absolute; top: 8px; right: 8px;
      background: rgba(255,255,255,0.9); padding: 8px;
      border-radius: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.3); z-index: 10;
      font-size: 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    #controls input[type="range"] {
      width: 120px;
    }
    
    #controls-hide {
      visible: hide;
    }

    #log {
      position: absolute; bottom: 0; left: 0; 
      width: 100vw;
      height: 10vh;
      overflow-y: auto; background: rgba(255,255,255,0.9); 
      font-size: 10px;
      padding: 5px; box-sizing: border-box; z-index: 10;
      border-top: 1px solid #ccc;
    }
    #centerMarker {
      position: absolute;
      left: 50%; top: 50%;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
      border: 3px solid black;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transform: translate(-50%, -50%);
      z-index: 5;
    }
    
    #info {
      position: absolute; 
      bottom: 10vh;
      right: 8px; 
      margin-bottom: 4px;
      background: rgba(255,255,255,0.9); 
      padding: 6px 10px;
      border-radius: 10px; 
      box-shadow: 0 0 5px rgba(0,0,0,0.3); 
      z-index: 10;
      font-size: 11px;
      max-width: 200px;
      text-align: right;
    }
    
    #left-menu {
      position: absolute; top: 8px; left: 8px; display: flex;
      flex-direction: column; gap: 6px; z-index: 10;
    }
    .menu-icon {
      width: 36px;
      height: 36px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.3); transition: background-color 0.2s;
    }
    .menu-icon svg { width: 22px; height: 22px; fill: #333; }
    .menu-icon.active { background-color: #4285F4; }
    .menu-icon.active svg { fill: #fff; }
    
    #color-legend {
      position: absolute;
      bottom: 10vh;
      left: 8px; z-index: 10;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3); font-size: 11px;
    }
    #color-legend .legend-item {
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    #color-legend .legend-color {
      width: 16px; height: 16px; border-radius: 50%; border: 1px solid #ccc;
    }
    
    #loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: none; /* Initially hidden */
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 20px;
      border-radius: 10px;
    }
    #loadingIcon {
      width: 40px;
      height: 40px;
    }
    #loadingText {
      font-family: sans-serif;
      color: #444;
      margin-top: 10px;
    }

      cursor: pointer;
    }

    .radius-btn.active {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
    } */

      width: 36px;

      cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.3); transition: background-color 0.2s;
      margin-top: 10px;
    }
    
    .radius-btn.active { background-color: #4285F4; color: white; border-color: #007bff; }
    
    
  </style>
</head>

  <script>
        // výchozí hodnota
    let radiusVal = 3;

    // výběr všech tlačítek pro radius
    const radiusButtons = document.querySelectorAll('.radius-btn');
    const radiusDisplay = document.getElementById('radiusVal');

    radiusButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // přečti hodnotu z data atributu
        radiusVal = parseFloat(btn.getAttribute('data-value'));
        // aktualizuj text na stránce
        radiusDisplay.textContent = radiusVal + ' km';

        // volitelně: zvýrazni aktivní tlačítko
        radiusButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      radiusVal.textContent = `${radiusVal} km`;
      updateLegend(radiusVal);
      debouncedGetPOIs();
    
        console.log('Vybraný radius:', radiusVal);
      });
    });
    //const radiusInput = radiusVal;
    //const radiusVal = radiusVal;
    console.log(radiusVal);
    
    const radarOverlay = document.getElementById('radar-overlay');
    // const radiusInput = document.getElementById('radius');
    const intervalInput = document.getElementById('interval');
    // const radiusVal = document.getElementById('radiusVal');
    const intervalVal = document.getElementById('intervalVal');
    const logDiv = document.getElementById('log');
    const infoDiv = document.getElementById('info');
    const menuIcons = document.querySelectorAll('.menu-icon');
    const loadingElement = document.getElementById('loading');
    const legendElement = document.getElementById('color-legend');
    
    let center = { lat: 50.2333, lon: 14.3833 }; // Fallback
    let heading = 0;
    let updateIntervalId = null;
    let lastPosition = null;
    let lastDirection = null;
    let isLoading = false;
    let activePoiElement = null;

    // ZMĚNA: Přidán dotaz pro kostely
    const queryParts = {
      toggleHistoric: `nwr[historic~"^(castle|ruins|chateau|fortress)$"](around:{{radius}},{{lat}},{{lon}})(if:t["name"]);`,
      toggleTowers: `nwr["man_made"="tower"]["tower:type"="observation"](around:{{radius}},{{lat}},{{lon}})(if:t["name"]);`,
      togglePeaks: `nwr["natural"="peak"](around:{{radius}},{{lat}},{{lon}})(if:t["ele"] > 500)(if:t["name"]);`,
      toggleNature: `nwr["leisure"="nature_reserve"](around:{{radius}},{{lat}},{{lon}})(if:t["name"]);`,
      toggleRestaurace: `nwr["amenity"~"cafe|bar|restaurant"](around:{{radius}},{{lat}},{{lon}})(if:t["name"]);`,
      toggleChurches: `nwr[building~"church|cathedral|basilica"](around:{{radius}},{{lat}},{{lon}})(if:t["name"]);`
    };

    function log(msg) {
      console.log(msg);
      const p = document.createElement('div');
      p.textContent = `[${new Date().toLocaleTimeString()}]: ${msg}`;
      logDiv.prepend(p);
    }
    
    function setLoading(state) {
        isLoading = state;
        loadingElement.style.display = state ? 'flex' : 'none';
    }
    
    function debounce(func, delay) {
        let timeout;
        return function(...args) {
            const context = this;
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(context, args), delay);
        };
    }

    const debouncedGetPOIs = debounce(() => {
        if (lastPosition) {
            getPOIs(lastPosition.lat, lastPosition.lon, radiusVal);
        }
    }, 300);

    intervalInput.oninput = () => {
      const newInterval = intervalInput.value * 1000;
      intervalVal.textContent = `${intervalInput.value} s`;
      clearInterval(updateIntervalId);
      updateIntervalId = setInterval(updatePosition, newInterval);
      log(`Interval aktualizace změněn na ${intervalInput.value} s.`);
    };
    
    menuIcons.forEach(icon => {
      icon.addEventListener('click', () => {
        icon.classList.toggle('active');
        if (lastPosition) {
            getPOIs(lastPosition.lat, lastPosition.lon, radiusVal);
        }
      });
    });

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    
    function getAzimuth(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function getDirectionFromHeading(deg) {
      if (deg === null || typeof deg === 'undefined') return 'N/A';
      const dirs = ['S', 'SV', 'V', 'JV', 'J', 'JZ', 'Z', 'SZ'];
      return dirs[Math.round(deg / 45) % 8];
    }
    
    function getPoiColor(distance, maxDistance) {
        const ratio = Math.min(distance / maxDistance, 1);
        let r, g, b;
        if (ratio < 1/3) {
            r = 255; g = Math.round(255 * (ratio * 3)); b = 0;
        } else if (ratio < 2/3) {
            r = Math.round(255 * (1 - (ratio - 1/3) * 3)); g = 255; b = 0;
        } else {
            r = 180; g = Math.round(255 * (1 - (ratio - 2/3) * 3)); b = Math.round(255 * ((ratio - 2/3) * 3));
        }
        return `rgb(${r}, ${g}, ${b})`;
    }

    function updateLegend(maxRadius) {
        legendElement.innerHTML = '';
        const steps = 5;
        for (let i = 1; i <= steps; i++) {
            const distance = (maxRadius / steps) * i;
            const color = getPoiColor(distance, maxRadius);
            const legendItem = document.createElement('div');
            legendItem.className = 'legend-item';
            legendItem.innerHTML = `<span class="legend-color" style="background-color: ${color};"></span> ${distance.toFixed(1)} km`;
            legendElement.appendChild(legendItem);
        }
    }

    function positionBubble(bubble, dotX, dotY) {
        const viewportWidth = radarOverlay.offsetWidth;
        const viewportHeight = radarOverlay.offsetHeight;
        const bubbleRect = bubble.getBoundingClientRect();
        const otherBubbles = Array.from(document.querySelectorAll('.poi-bubble:not(.position-applied)'));
        
        const margin = 10;
        const offsets = [3, 5, 12, 20, 30]; 

        let bestPos = null;
        let minOverlap = Infinity;

        for (const offset of offsets) {
            const positions = [
                { top: dotY - bubbleRect.height - offset, left: dotX - bubbleRect.width / 2 }, // Top
                { top: dotY + offset, left: dotX - bubbleRect.width / 2 }, // Bottom
                { top: dotY - bubbleRect.height / 2, left: dotX + offset }, // Right
                { top: dotY - bubbleRect.height / 2, left: dotX - bubbleRect.width - offset }, // Left
            ];

            for (const pos of positions) {
                const testRect = { x: pos.left, y: pos.top, width: bubbleRect.width, height: bubbleRect.height };
                if (testRect.x < margin || testRect.x + testRect.width > viewportWidth - margin ||
                    testRect.y < margin || testRect.y + testRect.height > viewportHeight - margin) {
                    continue;
                }
                let currentOverlap = 0;
                for (const other of otherBubbles) {
                    const otherRect = other.getBoundingClientRect();
                    const overlapX = Math.max(0, Math.min(testRect.x + testRect.width, otherRect.right) - Math.max(testRect.x, otherRect.left));
                    const overlapY = Math.max(0, Math.min(testRect.y + testRect.height, otherRect.bottom) - Math.max(testRect.y, otherRect.top));
                    currentOverlap += overlapX * overlapY;
                }
                if (currentOverlap < minOverlap) {
                    minOverlap = currentOverlap;
                    bestPos = pos;
                }
                if (minOverlap === 0) break;
            }
            if (minOverlap === 0) break;
        }
        
        if (bestPos) {
            bubble.style.left = `${bestPos.left - dotX}px`;
            bubble.style.top = `${bestPos.top - dotY}px`;
        } else { 
            bubble.style.left = `0px`;
            bubble.style.top = `0px`;
        }
        bubble.classList.add('position-applied');
    }

    function handlePoiClick(poiElement, poiData) {
        if (activePoiElement) {
            activePoiElement.classList.remove('active');
        }
        poiElement.classList.add('active');
        activePoiElement = poiElement;
        
        const wiki = (poiData.wiki || '').replace(/\s/g, '_');
        if (!wiki) { 
            log(`Pro '${poiData.name}' není k dispozici Wikipedia stránka.`); 
            return;
        }              
        log(`Načítám Wikipedii pro: ${wiki}`);
        
        setLoading(true);
        speechSynthesis.cancel();

        fetch(`https://cs.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wiki)}`)
            .then(res => res.ok ? res.json() : Promise.reject(res.statusText))
            .then(info => { 
                if (info.extract) {
                    const utterance = new SpeechSynthesisUtterance(info.extract);
                    utterance.lang = 'cs-CZ';
                    utterance.onend = () => setLoading(false);
                    utterance.onerror = () => setLoading(false); // Handle potential errors
                    speechSynthesis.speak(utterance);
                } else {
                    setLoading(false);
                }
            })
            .catch(err => {
                log(`Chyba při načítání shrnutí z Wikipedie: ${err}`);
                setLoading(false);
            });
    }

    function updatePoiDisplay(pois, maxDisplayRadiusKm) {
        radarOverlay.querySelectorAll('.poi-container').forEach(el => el.remove());
        activePoiElement = null;

        if (pois.length === 0) {
            log("Nebyly nalezeny žádné body zájmu.");
            return;
        }

        const centerX = radarOverlay.offsetWidth / 2;
        const centerY = radarOverlay.offsetHeight / 2;
        const maxDistPx = Math.min(centerX, centerY) * 0.9;

        const actualMaxDistanceKm = pois.reduce((max, p) => Math.max(max, p.distanceKm), 0);
        const scaleMaxKm = actualMaxDistanceKm > 0 ? actualMaxDistanceKm : maxDisplayRadiusKm;

        pois.forEach(poi => {
            const relativeAzimuth = (poi.azimuthDeg - heading + 360) % 360;
            const distPx = (poi.distanceKm / scaleMaxKm) * maxDistPx;
          
            const angleRad = (relativeAzimuth - 90) * Math.PI / 180;
            const poiX = centerX + distPx * Math.cos(angleRad);
            const poiY = centerY + distPx * Math.sin(angleRad);
          
            const poiElement = document.createElement('div');
            poiElement.className = 'poi-container';
            poiElement.style.left = `${poiX}px`;
            poiElement.style.top = `${poiY}px`;
          
            const poiColor = getPoiColor(poi.distanceKm, maxDisplayRadiusKm);
            poiElement.innerHTML = `<div class="poi-dot" style="background-color: ${poiColor};"></div><div class="poi-bubble" style="background-color: ${poiColor};">${poi.name}</div>`;
            radarOverlay.appendChild(poiElement);

            // ZMĚNA: Přidání event listeneru na celý kontejner
            poiElement.addEventListener('click', () => handlePoiClick(poiElement, poi));
        });

        setTimeout(() => {
            const allBubbles = document.querySelectorAll('.poi-bubble');
            allBubbles.forEach(bubble => bubble.classList.remove('position-applied'));
            document.querySelectorAll('.poi-container').forEach(container => {
                const bubble = container.querySelector('.poi-bubble');
                positionBubble(bubble, parseFloat(container.style.left), parseFloat(container.style.top));
                bubble.style.opacity = '1';
            });
        }, 50);
    }

    function getPOIs(lat, lon, radiusKm) {
        if (isLoading) {
            log("Čekám na dokončení předchozího načítání...");
            return;
        }
        setLoading(true);

        const activeQueries = Array.from(menuIcons)
            .filter(icon => icon.classList.contains('active'))
            .map(icon => queryParts[icon.id]);

        if (activeQueries.length === 0) {
            log("Žádný filtr není aktivní.");
            updatePoiDisplay([], radiusKm);
            setLoading(false);
            return;
        }
      
        const radiusMeters = radiusKm * 1000;
        const finalQueryBody = activeQueries.join('\n').replace(/{{lat}}/g, lat).replace(/{{lon}}/g, lon).replace(/{{radius}}/g, radiusMeters);
        const query = `[out:json][timeout:25];(${finalQueryBody}); out center;`;
        log(`Načítám POI pro [${lat.toFixed(4)}, ${lon.toFixed(4)}] v okruhu ${radiusKm} km`);

        fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: query })
            .then(res => res.json())
            .then(data => {
                const pois = data.elements.map(element => {
                    const latPOI = element.lat || element.center?.lat;
                    const lonPOI = element.lon || element.center?.lon;
                    if (!latPOI || !lonPOI) return null;
            
                    return {
                        name: element.tags.name || 'Neznámý',
                        distanceKm: getDistance(lat, lon, latPOI, lonPOI),
                        azimuthDeg: getAzimuth(lat, lon, latPOI, lonPOI),
                        wiki: element.tags.wikipedia
                    };
                }).filter(p => p !== null);

                updatePoiDisplay(pois, radiusKm);
                log(`Načteno ${pois.length} POI`);
                setLoading(false);
            })
            .catch(err => {
                log(`Chyba při načítání POI: ${err}`);
                setLoading(false);
            });
    }

    function updatePosition() {
        if (isLoading) return;
      
        log("Získávám aktuální polohu...");
        navigator.geolocation.getCurrentPosition(pos => {
            const newLat = pos.coords.latitude;
            const newLon = pos.coords.longitude;
            const newAlt = pos.coords.altitude;
            heading = pos.coords.heading || heading;
            const direction = getDirectionFromHeading(heading);
        
            infoDiv.textContent = `Poloha: ${newLat.toFixed(5)}, ${newLon.toFixed(5)} | Směr: ${direction} | Nadm. v: ${newAlt !== null ? `${Math.round(newAlt)} m` : 'N/A'}`;
        
            const positionChanged = !lastPosition || getDistance(lastPosition.lat, lastPosition.lon, newLat, newLon) > 0.05;
            const directionChanged = direction !== lastDirection;
        
            if (positionChanged || directionChanged) {
                lastPosition = { lat: newLat, lon: newLon };
                lastDirection = direction;
                getPOIs(newLat, newLon, radiusVal);
            } else {
                log("Pozice a směr bez výrazné změny, neaktualizuji POI.");
            }
        }, error => {
            const direction = getDirectionFromHeading(heading);
            infoDiv.textContent = `Poloha: fallback Kozomín | Směr: ${direction} | Nadm. v: N/A`;
            log(`Chyba polohy (${error.code}: ${error.message}), používám fallback.`);
            if (!lastPosition) {
                lastPosition = { lat: center.lat, lon: center.lon };
                getPOIs(center.lat, center.lon, radiusVal);
            }
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    }

    // --- Inicializace ---
    updateLegend(radiusVal);
    updatePosition();
    let updateIntervalValue = parseInt(intervalInput.value, 10) * 1000;
    updateIntervalId = setInterval(updatePosition, updateIntervalValue);
  </script>
